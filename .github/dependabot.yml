version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    assignees: [rogierlommers]
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [rogierlommers]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /docker-compose
    schedule:
      interval: weekly
    assignees: [rogierlommers]
